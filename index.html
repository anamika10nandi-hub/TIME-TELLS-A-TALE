<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Tells A Tale - Investigation Dossier</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    .scene {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    .scene.active {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* SCENE 1: Intro Video */
    #scene-video {
      background: #000;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-controls-overlay {
      position: absolute;
      bottom: 25px;
      right: 25px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }

    .tactical-btn {
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid #c5a059;
      color: #f1f1f1;
      padding: 10px 20px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
      transition: all 0.3s ease;
    }

    .tactical-btn:hover {
      background: #c5a059;
      color: #000;
      box-shadow: 0 0 18px rgba(197, 160, 89, 0.6);
    }

    /* SCENE 2: Case Introduction (Full Screen Aspect Box) */
    #scene-briefing {
      background: #0b0c10;
    }

    .briefing-stage {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 aspect ratio locked */
      max-height: 100vh;
      max-width: 177.78vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .briefing-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    /* Black Arrow button overlapping the printed arrow on the paper */
    .paper-arrow-btn {
      position: absolute;
      bottom: 16%;
      left: 58.6%;
      width: 3.2%;
      height: 5.5%;
      background: rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s;
      z-index: 5;
    }

    .paper-arrow-btn svg {
      width: 65%;
      height: 65%;
      fill: #ffffff;
    }

    .paper-arrow-btn:hover {
      transform: scale(1.18);
      background: #111;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.6);
    }

    /* SCENE 3: Investigation Board (Full Screen) */
    #scene-investigation {
      background: #000;
    }

    .board-stage {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 ratio locked so hot-spots stay aligned on all screens */
      max-height: 100vh;
      max-width: 177.78vh;
    }

    .board-stage img.board-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    /* Interactive Clickable Hotspots mapped over each pinned photo */
    .case-hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.25s ease;
      background: rgba(255, 255, 255, 0.0);
    }

    .case-hotspot:hover {
      background: rgba(255, 220, 100, 0.12);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.45);
      transform: scale(1.03);
    }

    /* Lightbox Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 84vh;
      border: 3px solid #222;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
      object-fit: contain;
    }

    .modal-close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 2px;
    }

    .modal-caption {
      margin-top: 10px;
      color: #d1d1d1;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- SCENE 1: Intro Video -->
  <section id="scene-video" class="scene active">
    <video id="intro-video" autoplay muted playsinline preload="auto" controls>
      <source src="video/intro%20video/intro%20video.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
    <div class="video-controls-overlay">
      <button class="tactical-btn" id="btn-unmute">🔊 Unmute</button>
      <button class="tactical-btn" id="btn-to-briefing">Proceed &rarr;</button>
    </div>
  </section>

  <!-- SCENE 2: Written Board (Case Introduction) -->
  <section id="scene-briefing" class="scene">
    <div class="briefing-stage">
      <img src="image/Case%20Introduction/Case%20Introduction.png" alt="Case Introduction" />
      
      <!-- Black Arrow Button overlapping the printed arrow on the paper -->
      <button class="paper-arrow-btn" id="btn-to-board" title="Open Criminal Investigation Board">
        <svg viewBox="0 0 24 24">
          <path d="M5 12h14M13 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- SCENE 3: Criminal Investigation Board -->
  <section id="scene-investigation" class="scene">
    <div class="board-stage">
      <!-- Fullscreen investigation board visual -->
      <img class="board-bg" src="image/case%20board/case%20board.png" alt="Criminal Investigation Board" />

      <!-- ROW 1 HOTSPOTS (Cases 001 - 005) -->
      <div class="case-hotspot" style="top: 22%; left: 10.5%; width: 14.8%; height: 32%;"
           data-full="image/Case/Case%20%23001.png" data-title="Case #001"></div>

      <div class="case-hotspot" style="top: 22%; left: 26.8%; width: 14.8%; height: 32%;"
           data-full="image/Case/Case%20%23002.png" data-title="Case #002"></div>

      <div class="case-hotspot" style="top: 22%; left: 42.6%; width: 14.8%; height: 32%;"
           data-full="image/Case/Case%20%23003.png" data-title="Case #003"></div>

      <div class="case-hotspot" style="top: 22%; left: 58.7%; width: 14.8%; height: 32%;"
           data-full="image/Case/Case%20%23004.png" data-title="Case #004"></div>

      <div class="case-hotspot" style="top: 22%; left: 74.8%; width: 14.8%; height: 32%;"
           data-full="image/Case/Case%20%23005.png" data-title="Case #005"></div>

      <!-- ROW 2 HOTSPOTS (Cases 006 - 009 & The Verdict) -->
      <div class="case-hotspot" style="top: 59%; left: 10.5%; width: 14.8%; height: 34%;"
           data-full="image/Case/Case%20%23006.png" data-title="Case #006"></div>

      <div class="case-hotspot" style="top: 59%; left: 26.8%; width: 14.8%; height: 34%;"
           data-full="image/Case/Case%20%23007.png" data-title="Case #007"></div>

      <div class="case-hotspot" style="top: 59%; left: 42.6%; width: 14.8%; height: 34%;"
           data-full="image/Case/Case%20%23008.png" data-title="Case #008"></div>

      <div class="case-hotspot" style="top: 59%; left: 58.7%; width: 14.8%; height: 34%;"
           data-full="image/Case/Case%20%23009.png" data-title="Case #009"></div>

      <div class="case-hotspot" style="top: 57%; left: 74.8%; width: 15.2%; height: 36%;"
           data-full="image/The%20verdict/The%20verdict.png" data-title="The Verdict"></div>
    </div>
  </section>

  <!-- Fullscreen Modal Lightbox -->
  <div class="modal-overlay" id="file-modal">
    <div class="modal-content">
      <button class="modal-close-btn" id="modal-close">&times; CLOSE</button>
      <img id="modal-img" src="" alt="Case File Preview" />
      <div class="modal-caption" id="modal-caption"></div>
    </div>
  </div>

  <script>
    const sceneVideo = document.getElementById('scene-video');
    const sceneBriefing = document.getElementById('scene-briefing');
    const sceneInvestigation = document.getElementById('scene-investigation');

    const btnToBriefing = document.getElementById('btn-to-briefing');
    const btnToBoard = document.getElementById('btn-to-board');
    const video = document.getElementById('intro-video');
    const unmuteBtn = document.getElementById('btn-unmute');

    function switchScene(fromScene, toScene) {
      fromScene.classList.remove('active');
      toScene.classList.add('active');
    }

    // Audio toggle
    unmuteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      unmuteBtn.textContent = video.muted ? '🔊 Unmute' : '🔇 Mute';
      if (video.paused) video.play();
    });

    // Scene Navigation
    btnToBriefing.addEventListener('click', (e) => {
      e.stopPropagation();
      video.pause();
      switchScene(sceneVideo, sceneBriefing);
    });

    btnToBoard.addEventListener('click', () => {
      switchScene(sceneBriefing, sceneInvestigation);
    });

    // Case Hotspot Modal Lightbox
    const modal = document.getElementById('file-modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');
    const modalClose = document.getElementById('modal-close');

    document.querySelectorAll('.case-hotspot').forEach(hotspot => {
      hotspot.addEventListener('click', () => {
        const fullSrc = hotspot.getAttribute('data-full');
        const title = hotspot.getAttribute('data-title');
        
        modalImg.src = fullSrc;
        modalCaption.textContent = title;
        modal.classList.add('active');
      });
    });

    function closeModal() {
      modal.classList.remove('active');
      modalImg.src = '';
      modalCaption.textContent = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
