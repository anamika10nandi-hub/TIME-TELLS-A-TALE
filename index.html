<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Tells A Tale - Investigation Dossier</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .scene {
      display: none;
      width: 100vw;
      min-height: 100vh;
      position: relative;
    }

    .scene.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* SCENE 1: Intro Video */
    #scene-video {
      background: #000;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-controls-overlay {
      position: absolute;
      bottom: 30px;
      right: 30px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }

    .tactical-btn {
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid #c5a059;
      color: #f1f1f1;
      padding: 12px 24px;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
      transition: all 0.3s ease;
    }

    .tactical-btn:hover {
      background: #c5a059;
      color: #000;
      box-shadow: 0 0 20px rgba(197, 160, 89, 0.6);
    }

    /* SCENE 2: Written Board (Case Introduction) */
    #scene-briefing {
      padding: 30px 15px;
      background: #121316;
    }

    .board-container {
      position: relative;
      max-width: 1100px;
      width: 92vw;
      border: 6px solid #23272a;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      border-radius: 4px;
      overflow: hidden;
      background: #1a1a1d;
    }

    .board-container img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* Bottom-Right Arrow Button */
    .nav-arrow-btn {
      position: absolute;
      bottom: 24px;
      right: 28px;
      background: rgba(179, 0, 0, 0.9);
      border: 2px solid #ff4d4d;
      color: #fff;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 77, 77, 0.6);
      transition: transform 0.2s ease, background 0.3s ease;
      animation: pulseGlow 1.8s infinite;
    }

    .nav-arrow-btn svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-arrow-btn:hover {
      transform: scale(1.12);
      background: #e60000;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 8px rgba(255, 77, 77, 0.4); }
      50% { box-shadow: 0 0 22px rgba(255, 77, 77, 0.9); }
      100% { box-shadow: 0 0 8px rgba(255, 77, 77, 0.4); }
    }

    /* SCENE 3: Investigation Board */
    #scene-investigation {
      padding: 40px 15px;
      background: radial-gradient(circle, #2b231b 0%, #110d0a 100%);
      min-height: 100vh;
      justify-content: flex-start;
    }

    .corkboard-title {
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #c5a059;
      text-transform: uppercase;
      margin-bottom: 25px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .corkboard {
      position: relative;
      width: 95vw;
      max-width: 1400px;
      background-color: #382d22;
      border: 16px solid #201711;
      border-radius: 6px;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.85), 0 20px 40px rgba(0,0,0,0.9);
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
    }

    .case-card {
      background: #fbf8f0;
      color: #111;
      padding: 10px 10px 16px 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      width: 220px;
      text-align: center;
    }

    .case-card::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #cc0000;
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .case-card:nth-child(3n+1) { transform: rotate(-2deg); }
    .case-card:nth-child(3n+2) { transform: rotate(1.5deg); }
    .case-card:nth-child(3n) { transform: rotate(-1deg); }

    .case-card:hover {
      transform: scale(1.08) rotate(0deg);
      box-shadow: 0 18px 30px rgba(0, 0, 0, 0.85);
      z-index: 5;
    }

    .case-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      border: 1px solid #ddd;
      background-color: #eee;
    }

    .case-tag {
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7a1515;
    }

    .case-card.verdict {
      border: 2px dashed #990000;
      background: #fff3f3;
      transform: rotate(2deg);
    }

    .case-card.verdict .case-tag {
      color: #b30000;
      font-size: 0.95rem;
      font-weight: 900;
    }

    /* Modal Viewer */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(5px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 82vh;
      border: 4px solid #fff;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
      object-fit: contain;
    }

    .modal-close-btn {
      position: absolute;
      top: -45px;
      right: 0;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 1px;
    }

    .modal-caption {
      margin-top: 14px;
      color: #d1d1d1;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- SCENE 1: Intro Video -->
  <section id="scene-video" class="scene active">
    <!-- video attributes: controls enabled as fallback so user can hit play manually if blocked -->
    <video id="intro-video" autoplay muted playsinline preload="auto" controls>
      <source src="./video/intro%20video/intro%20video.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
    <div class="video-controls-overlay">
      <button class="tactical-btn" id="btn-unmute">🔊 Unmute</button>
      <button class="tactical-btn" id="btn-to-briefing">Proceed &rarr;</button>
    </div>
  </section>

  <!-- SCENE 2: Written Board -->
  <section id="scene-briefing" class="scene">
    <div class="board-container">
      <!-- Relative path using explicit ./ and URL encoded spaces -->
      <img id="briefing-img" src="./Case%20Introduction/Case%20Introduction.png" alt="Case Introduction" />
      <button class="nav-arrow-btn" id="btn-to-board" title="Access Investigation Board">
        <svg viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </button>
    </div>
  </section>

  <!-- SCENE 3: Criminal Investigation Board -->
  <section id="scene-investigation" class="scene">
    <h2 class="corkboard-title">Criminal Investigation Board</h2>
    
    <div class="corkboard">
      
      <!-- Cases 001 - 009 -->
      <div class="case-card" data-full="./Case/Case%20%23001.png" data-title="Case #001">
        <img src="./Case/Case%20%23001.png" alt="Case #001" />
        <div class="case-tag">Case #001</div>
      </div>

      <div class="case-card" data-full="./Case/Case%20%23002.png" data-title="Case #002">
        <img src="./Case/Case%20%23002.png" alt="Case #002" />
        <div class="case-tag">Case #002</div>
      </div>

      <div class="case-card" data-full="./Case/Case%20%23003.png" data-title="Case #003">
        <img src="./Case/Case%20%23003.png" alt="Case #003" />
        <div class="case-tag">Case #003</div>
      </div>

      <div class="case-card" data-full="./Case/Case%20%23004.png" data-title="Case #004">
        <img src="./Case/Case%20%23004.png" alt="Case #004" />
        <div class="case-tag">Case #004</div>
      </div>

      <div class="case-card" data-full="./Case/Case%20%23005.png" data-title="Case #005">
        <img src="./Case/Case%20%23005.png" alt="Case #005" />
        <div class="case-tag">Case #005</div>
      </div>

      <div class="case-card" data-full="./Case/Case%20%23006.png" data-title="Case #006">
        <img src="./Case/Case%20%23006.png" alt="Case #006" />
        <div class="case-tag">Case #006</div>
      </div>

      <div class="case-card" data-full="./Case/Case%20%23007.png" data-title="Case #007">
        <img src="./Case/Case%20%23007.png" alt="Case #007" />
        <div class="case-tag">Case #007</div>
      </div>

      <div class="case-card" data-full="./Case/Case%20%23008.png" data-title="Case #008">
        <img src="./Case/Case%20%23008.png" alt="Case #008" />
        <div class="case-tag">Case #008</div>
      </div>

      <div class="case-card" data-full="./Case/Case%20%23009.png" data-title="Case #009">
        <img src="./Case/Case%20%23009.png" alt="Case #009" />
        <div class="case-tag">Case #009</div>
      </div>

      <!-- The Verdict -->
      <div class="case-card verdict" data-full="./The%20verdict/The%20verdict.png" data-title="Final Verdict">
        <img src="./The%20verdict/The%20verdict.png" alt="The Verdict" />
        <div class="case-tag">&#9888; The Verdict</div>
      </div>

    </div>
  </section>

  <!-- Modal Lightbox -->
  <div class="modal-overlay" id="file-modal">
    <div class="modal-content">
      <button class="modal-close-btn" id="modal-close">&times; CLOSE</button>
      <img id="modal-img" src="" alt="Case File Preview" />
      <div class="modal-caption" id="modal-caption"></div>
    </div>
  </div>

  <script>
    const sceneVideo = document.getElementById('scene-video');
    const sceneBriefing = document.getElementById('scene-briefing');
    const sceneInvestigation = document.getElementById('scene-investigation');

    const btnToBriefing = document.getElementById('btn-to-briefing');
    const btnToBoard = document.getElementById('btn-to-board');
    const video = document.getElementById('intro-video');
    const unmuteBtn = document.getElementById('btn-unmute');

    // Force browser play attempt
    function triggerVideoPlayback() {
      video.muted = true;
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.warn("Autoplay blocked by browser. User interaction required:", error);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', triggerVideoPlayback);
    // Click anywhere on the video scene to play if browser blocked autoplay
    sceneVideo.addEventListener('click', (e) => {
      if (e.target !== btnToBriefing && e.target !== unmuteBtn) {
        if (video.paused) {
          video.play();
        }
      }
    });

    function switchScene(fromScene, toScene) {
      fromScene.classList.remove('active');
      toScene.classList.add('active');
      window.scrollTo(0, 0);
    }

    // Audio toggling
    unmuteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      unmuteBtn.textContent = video.muted ? '🔊 Unmute' : '🔇 Mute';
      if (video.paused) video.play();
    });

    // Scene Navigation
    btnToBriefing.addEventListener('click', (e) => {
      e.stopPropagation();
      video.pause();
      switchScene(sceneVideo, sceneBriefing);
    });

    btnToBoard.addEventListener('click', () => {
      switchScene(sceneBriefing, sceneInvestigation);
    });

    // Modal Lightbox
    const modal = document.getElementById('file-modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');
    const modalClose = document.getElementById('modal-close');

    document.querySelectorAll('.case-card').forEach(card => {
      card.addEventListener('click', () => {
        const fullSrc = card.getAttribute('data-full');
        const title = card.getAttribute('data-title');
        
        modalImg.src = fullSrc;
        modalCaption.textContent = title;
        modal.classList.add('active');
      });
    });

    function closeModal() {
      modal.classList.remove('active');
      modalImg.src = '';
      modalCaption.textContent = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    // Diagnostics: Print any broken image to the console with its exact attempted URL
    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('error', () => {
        console.error("Failed to load file at exact URL:", img.src);
      });
    });
  </script>
</body>
</html>
