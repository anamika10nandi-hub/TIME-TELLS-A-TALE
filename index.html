<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Tells A Tale - Investigation Dossier</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #e0e0e0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    .scene {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    .scene.active {
      display: block;
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* SCENE 1: Intro Video */
    #scene-video {
      background: #000;
    }

    #intro-video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    .video-controls-overlay {
      position: absolute;
      bottom: 25px;
      right: 25px;
      z-index: 10;
      display: flex;
      gap: 12px;
    }

    .tactical-btn {
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid #c5a059;
      color: #f1f1f1;
      padding: 10px 20px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
      transition: all 0.3s ease;
    }

    .tactical-btn:hover {
      background: #c5a059;
      color: #000;
      box-shadow: 0 0 18px rgba(197, 160, 89, 0.6);
    }

    /* SCENE 2: Written Board (Case Introduction) */
    #scene-briefing {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .briefing-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      user-select: none;
    }

    /* Invisible click hotspot mapped directly over the printed arrow */
    .paper-arrow-btn {
      position: absolute;
      top: 87.5%;
      left: 59.8%;
      width: 3.8%;
      height: 5.2%;
      background: transparent;
      border: none;
      outline: none;
      cursor: pointer;
      z-index: 50;
      border-radius: 4px;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .paper-arrow-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    /* SCENE 3: Investigation Board */
    #scene-investigation {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .board-bg {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      user-select: none;
    }

    /* Interactive Clickable Hotspots mapped directly over the cases */
    .case-hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      background-color: rgba(255, 255, 255, 0);
    }

    .case-hotspot:hover {
      background-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    /* Fullscreen Modal Lightbox */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 84vh;
      border: 3px solid #222;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
      object-fit: contain;
    }

    .modal-close-btn {
      position: absolute;
      top: -40px;
      right: 0;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 2px;
    }

    .modal-caption {
      margin-top: 10px;
      color: #d1d1d1;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- SCENE 1: Intro Video -->
  <section id="scene-video" class="scene active">
    <video id="intro-video" autoplay muted playsinline preload="auto" controls>
      <source src="video/intro%20video/intro%20video.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>
    <div class="video-controls-overlay">
      <button class="tactical-btn" id="btn-unmute">🔊 Unmute</button>
      <button class="tactical-btn" id="btn-to-briefing">Proceed &rarr;</button>
    </div>
  </section>

  <!-- SCENE 2: Case Introduction -->
  <section id="scene-briefing" class="scene">
    <img class="briefing-bg" src="image/Case%20Introduction/Case%20Introduction.png" alt="Case Introduction" />
    
    <!-- Seamless invisible hotspot right over your printed arrow -->
    <button class="paper-arrow-btn" id="btn-to-board" title="Open Investigation Board"></button>
  </section>

  <!-- SCENE 3: Criminal Investigation Board -->
  <section id="scene-investigation" class="scene">
    <img class="board-bg" src="image/case%20board/case%20board.png" alt="Criminal Investigation Board" />

    <!-- ROW 1 (Cases 1 - 4) -->
    <!-- Case 1: The Victim Disappears -->
    <div class="case-hotspot" style="top: 11.5%; left: 29.0%; width: 13.0%; height: 26.5%;"
         data-full="image/Case/Case%20%23001.png" data-title="Case #001: The Victim Disappears"></div>

    <!-- Case 2: The Double Identity -->
    <div class="case-hotspot" style="top: 12.0%; left: 43.6%; width: 13.4%; height: 26.5%;"
         data-full="image/Case/Case%20%23002.png" data-title="Case #002: The Double Identity"></div>

    <!-- Case 3: The Ecosystem Conspiracy -->
    <div class="case-hotspot" style="top: 12.0%; left: 58.4%; width: 13.7%; height: 26.5%;"
         data-full="image/Case/Case%20%23003.png" data-title="Case #003: The Ecosystem Conspiracy"></div>

    <!-- Case 4: The Luxury Alibi -->
    <div class="case-hotspot" style="top: 11.8%; left: 73.2%; width: 13.2%; height: 26.5%;"
         data-full="image/Case/Case%20%23004.png" data-title="Case #004: The Luxury Alibi"></div>

    <!-- ROW 2 (Cases 5 - 8) -->
    <!-- Case 5: The Postmodern Impostors -->
    <div class="case-hotspot" style="top: 40.5%; left: 19.0%; width: 14.8%; height: 25.5%;"
         data-full="image/Case/Case%20%23005.png" data-title="Case #005: The Postmodern Impostors"></div>

    <!-- Case 6: The Material Witnesses -->
    <div class="case-hotspot" style="top: 41.0%; left: 35.0%; width: 16.5%; height: 25.5%;"
         data-full="image/Case/Case%20%23006.png" data-title="Case #006: The Material Witnesses"></div>

    <!-- Case 7: The Sustainability Interrogation -->
    <div class="case-hotspot" style="top: 41.5%; left: 53.0%; width: 17.5%; height: 25.5%;"
         data-full="image/Case/Case%20%23007.png" data-title="Case #007: The Sustainability Interrogation"></div>

    <!-- Case 8: The Digital Archive Break-In -->
    <div class="case-hotspot" style="top: 41.5%; left: 71.8%; width: 15.5%; height: 25.5%;"
         data-full="image/Case/Case%20%23008.png" data-title="Case #008: The Digital Archive Break-In"></div>

    <!-- ROW 3 (Case 9 & The Verdict) -->
    <!-- Case 9: The Human Cost -->
    <div class="case-hotspot" style="top: 68.5%; left: 22.5%; width: 15.2%; height: 25.0%;"
         data-full="image/Case/Case%20%23009.png" data-title="Case #009: The Human Cost"></div>

    <!-- The Verdict -->
    <div class="case-hotspot" style="top: 68.5%; left: 38.5%; width: 23.8%; height: 25.0%;"
         data-full="image/The%20verdict/The%20verdict.png" data-title="Final Verdict: Identity Theft"></div>
  </section>

  <!-- Fullscreen Modal Lightbox -->
  <div class="modal-overlay" id="file-modal">
    <div class="modal-content">
      <button class="modal-close-btn" id="modal-close">&times; CLOSE</button>
      <img id="modal-img" src="" alt="Case File Preview" />
      <div class="modal-caption" id="modal-caption"></div>
    </div>
  </div>

  <script>
    const sceneVideo = document.getElementById('scene-video');
    const sceneBriefing = document.getElementById('scene-briefing');
    const sceneInvestigation = document.getElementById('scene-investigation');

    const btnToBriefing = document.getElementById('btn-to-briefing');
    const btnToBoard = document.getElementById('btn-to-board');
    const video = document.getElementById('intro-video');
    const unmuteBtn = document.getElementById('btn-unmute');

    // Force browser playback attempt
    function triggerVideoPlayback() {
      video.muted = true;
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.warn("Autoplay blocked by browser. Click anywhere to start:", error);
        });
      }
    }

    window.addEventListener('DOMContentLoaded', triggerVideoPlayback);
    sceneVideo.addEventListener('click', (e) => {
      if (e.target !== btnToBriefing && e.target !== unmuteBtn) {
        if (video.paused) video.play();
      }
    });

    function switchScene(fromScene, toScene) {
      fromScene.classList.remove('active');
      toScene.classList.add('active');
    }

    // Audio toggle
    unmuteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      unmuteBtn.textContent = video.muted ? '🔊 Unmute' : '🔇 Mute';
      if (video.paused) video.play();
    });

    // Scene Navigation
    btnToBriefing.addEventListener('click', (e) => {
      e.stopPropagation();
      video.pause();
      switchScene(sceneVideo, sceneBriefing);
    });

    btnToBoard.addEventListener('click', () => {
      switchScene(sceneBriefing, sceneInvestigation);
    });

    // Modal Lightbox for Case Files
    const modal = document.getElementById('file-modal');
    const modalImg = document.getElementById('modal-img');
    const modalCaption = document.getElementById('modal-caption');
    const modalClose = document.getElementById('modal-close');

    document.querySelectorAll('.case-hotspot').forEach(hotspot => {
      hotspot.addEventListener('click', () => {
        const fullSrc = hotspot.getAttribute('data-full');
        const title = hotspot.getAttribute('data-title');
        
        modalImg.src = fullSrc;
        modalCaption.textContent = title;
        modal.classList.add('active');
      });
    });

    function closeModal() {
      modal.classList.remove('active');
      modalImg.src = '';
      modalCaption.textContent = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
